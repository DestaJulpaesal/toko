services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glosir
      POSTGRES_PASSWORD: glosir_local_dev
      POSTGRES_DB: glosir_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glosir -d glosir_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: